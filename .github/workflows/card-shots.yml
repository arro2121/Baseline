# Temporary: photographs real Cosmic cards on the live site and commits the picture to this branch (never main)
name: Card shots
on:
  push:
    branches: [claude/card-shots]
    paths: ["tools/card_shots.mjs", ".github/workflows/card-shots.yml"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: mkdir -p shots && node tools/card_shots.mjs
      - run: |
          git config user.name "card-shots"; git config user.email "card-shots@users.noreply.github.com"
          git add shots && git commit -m "Card shots from the live site" && git push
