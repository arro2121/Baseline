# Baseline: one workflow that unpacks the app, sets up alerts, keeps ratings fresh and publishes the site.
name: Baseline
on:
  push:
    branches: [main]
    paths: ["baseline*.zip", ".github/workflows/baseline.yml", "template.html", "build_site.py", "engine.py", "sports_engine.py", "team_models.py", "team_history.py", "season_sim.py", "updater.py", "team_colors.json", "requirements.txt", "alerts/*.js", "alerts/*.sh", "alerts/wrangler.toml", "alerts/package.json", "custom_domain.txt"]
  schedule:
    - cron: "*/5 * * * *"    # live: a backup copy of the scores on the site itself (plus tennis when there is no alerts service)
    - cron: "15 7 * * *"     # nightly: new results, rankings, ratings, model
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        type: choice
        options: [everything, nightly, live, alerts]
        default: everything
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: baseline
  cancel-in-progress: false

jobs:
  unpack:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Unpack baseline.zip (if it was just uploaded)
        run: |
          if ! ls baseline*.zip >/dev/null 2>&1; then echo "Nothing to unpack"; exit 0; fi
          # GitHub's uploader may save it as "baseline (2).zip", and renaming it in the web editor
          # corrupts it, so unpack the newest baseline*.zip in history that is a real zip file.
          for c in $(git rev-list HEAD -- 'baseline*.zip'); do
            for blob in $(git ls-tree "$c" | grep -P '\tbaseline[^/]*\.zip$' | awk '{print $3}'); do
              git cat-file -p "$blob" > "$RUNNER_TEMP/baseline.zip"
              if unzip -tq "$RUNNER_TEMP/baseline.zip" >/dev/null 2>&1; then found=1; break 2; fi
            done
          done
          if [ -z "$found" ]; then echo "::error::No valid baseline.zip found. Upload it again with Add file > Upload files."; exit 1; fi
          unzip -o -q "$RUNNER_TEMP/baseline.zip" -x ".github/*" -d .
          git rm -q -- baseline*.zip
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add -A && git commit -q -m "Unpack Baseline" && git push

  alerts:
    needs: unpack
    if: always() && needs.unpack.result != 'failure' && (github.event_name == 'push' || inputs.task == 'everything' || inputs.task == 'alerts')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Set up the alerts service on Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          API_TENNIS_KEY: ${{ secrets.API_TENNIS_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COMETS_KEY: ${{ secrets.COMETS_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "::notice::No CLOUDFLARE_API_TOKEN secret, so notifications with the app closed are off. Add it and run this workflow again to turn them on."; exit 0; fi
          bash alerts/setup.sh
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add -A alerts site_config.json && (git commit -q -m "Alerts service settings" && git push) || echo "No changes"

  nightly:
    needs: [unpack, alerts]
    if: always() && needs.unpack.result != 'failure' && (github.event_name == 'push' || github.event.schedule == '15 7 * * *' || inputs.task == 'everything' || inputs.task == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ github.ref_name }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - name: Download new results and rankings
        env: { API_TENNIS_KEY: "${{ secrets.API_TENNIS_KEY }}" }
        run: |
          python -c "import engine; [engine.fetch(f'data/{t}_players.csv', f'{engine.MIRROR}/{t}/{t}_players.csv') for t in ('atp','wta')]"
          if [ -z "$API_TENNIS_KEY" ]; then echo "::warning::No API_TENNIS_KEY secret: publishing without live data or new results."; exit 0; fi
          python updater.py rankings
          python updater.py results
          python updater.py live
      - name: Recalculate ratings and retrain the model
        run: python engine.py
      - name: Update NFL, NBA, MLB, NHL and Premier League ratings
        run: python sports_engine.py --download --espn
      - name: Simulate the rest of every season (playoff and title odds)
        run: python season_sim.py || echo "Kept the previous simulations"
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Update player stats for League Leaders
        run: node alerts/allstars.mjs || echo "Kept the previous players"
      - name: Update every roster for the Cosmic player cards
        run: node alerts/rosters.mjs || echo "Kept the previous rosters"
      - name: Keep a copy of the model's track record
        run: |
          U=$(python3 -c "import json;print(json.load(open('site_config.json')).get('alerts_url',''))" 2>/dev/null || true)
          if [ -n "$U" ] && curl -sfm 60 "$U/track" -o /tmp/track.json && python3 -c "import json;assert isinstance(json.load(open('/tmp/track.json'))['picks'],list)"; then cp /tmp/track.json docs/track.json; else echo "Kept the previous copy"; fi
      - name: Build the app
        run: python build_site.py
      - name: Save
        run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git pull -q --rebase || true
          git add -A snapshot.json sports.json data docs && (git commit -q -m "Nightly update $(date -u +%F)" && git push) || echo "No changes"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4

  live:
    if: github.event.schedule == '*/5 * * * *' || inputs.task == 'live'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ ! -f docs/index.html ]; then echo "skip=1" >> "$GITHUB_OUTPUT"; echo "Not built yet."; fi
          if grep -q '"alerts_url": *"http' site_config.json 2>/dev/null; then echo "alerts=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1' && steps.check.outputs.alerts != '1'
        with: { python-version: "3.12" }
      - name: Fetch live tennis
        if: steps.check.outputs.skip != '1' && steps.check.outputs.alerts != '1'
        env: { API_TENNIS_KEY: "${{ secrets.API_TENNIS_KEY }}" }
        run: python updater.py live
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with: { node-version: "22" }
      - name: Publish a backup copy of today's scores
        if: steps.check.outputs.skip != '1'
        run: |
          (cd alerts && npm install --no-audit --no-fund --silent)
          node alerts/snapshot.mjs || echo "Snapshot skipped"
      - uses: actions/configure-pages@v5
        if: steps.check.outputs.skip != '1'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.skip != '1'
        with: { path: docs }
      - id: deploy
        if: steps.check.outputs.skip != '1'
        uses: actions/deploy-pages@v4
