# Temporary: try the roster builder's Premier League photo matching. Safe to delete.
name: Probes
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml", "alerts/rosters.mjs"]
permissions:
  contents: read
jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: node alerts/rosters.mjs
      - run: node -e 'const R=require("./docs/rosters.json").leagues; for (const [lg,l] of Object.entries(R)) console.log(lg, l.length, "with photo", l.filter(p=>p.img).length); console.log(R.epl.filter(p=>p.img).slice(0,5).map(p=>p.name+" "+p.img).join("\n"))'
      - run: for u in $(node -e 'console.log(require("./docs/rosters.json").leagues.epl.filter(p=>p.img).slice(0,4).map(p=>p.img).join(" "))'); do curl -s -o /dev/null -w "%{http_code} $u\n" "$u"; done
