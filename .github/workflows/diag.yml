name: Alerts check
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deploy
        run: sleep 170
      - name: Probe
        run: |
          W=$(python3 -c "import json,urllib.request;print(json.load(urllib.request.urlopen('https://raw.githubusercontent.com/${{ github.repository }}/main/site_config.json'))['alerts_url'])")
          echo "== /"; curl -s -m 20 "$W/"; echo
          echo "== mlb scoreboard"; curl -s -m 30 "$W/sports/mlb/scoreboard" | head -c 500; echo
          echo "== mlb game"; curl -s -m 30 "$W/sports/mlb/game/m824223" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('id'),d.get('status'),d.get('count'),len(d.get('videos') or []),d.get('error'))"
          echo "== ask"; curl -s -m 90 -X POST -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"Which MLB games were played most recently and who won? Keep it short."}],"context":"Teams they follow: MLB: Detroit Tigers"}' "$W/ask"; echo
          echo "== ask status"; curl -s -o /dev/null -w "%{http_code}\n" -m 90 -X POST -H 'Content-Type: application/json' -d '{"messages":[{"role":"user","content":"hi"}]}' "$W/ask"
