# Temporary: runs the season simulations and the NFL leaders against live data. Safe to delete.
name: Probes
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q -r requirements.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          mkdir -p .github/diag
          (python season_sim.py mlb nhl nba nfl epl 2>&1; python -c "
          import json;d=json.load(open('docs/sim.json'))
          for lg,L in d['leagues'].items():
              print(lg, L.get('played'), L.get('left'), 'big', len(L.get('big',[])))
              for t in sorted(L['teams'], key=lambda t:-t['title'])[:4]: print('   ', t['name'], t['w'], t['l'], 'playoff', t.get('playoff', t.get('top4')), 'title', t['title'], 'luck', t.get('luck'), 'next', t.get('next'))
              for b in L.get('big',[])[:3]: print('    big', b)
          ") > .github/diag/sim.log
          node alerts/allstars.mjs > .github/diag/allstars.log 2>&1 || true
          python -c "
          import json;d=json.load(open('docs/allstars.json'))['sports']['nfl']
          print('season', d['season'], 'games', d.get('games'), 'current', d.get('current'))
          for k in ('qbs','rbs','wrs','def','ks'):
              L=d.get(k,[]); print(k, len(L), [ (p['name'], p['line']) for p in L[:3]])
          top=lambda k,s: sorted([p for p in d['def'] if p['s'].get(s) is not None], key=lambda p:-p['s'][s])[:3]
          print('sacks', [(p['name'],p['s']['sacks']) for p in top('def','sacks')]); print('tkl', [(p['name'],p['s']['tkl']) for p in top('def','tkl')]); print('int', [(p['name'],p['s']['int']) for p in top('def','int')])
          " >> .github/diag/allstars.log 2>&1
          cp docs/sim.json .github/diag/sim.json
      - run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag && git commit -q -m "Probe results" && git push
