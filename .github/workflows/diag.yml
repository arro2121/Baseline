# Temporary: checks the live-scores service from GitHub's servers. Safe to delete.
name: Diagnose live scores
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          E=https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard
          echo "=== Baseline UA"; curl -sS -o /dev/null -w "%{http_code}\n" -A "Baseline/1.0 (personal, non-commercial)" $E
          echo "=== browser UA"; curl -sS -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1" $E
          echo "=== no UA"; curl -sS -o /dev/null -w "%{http_code}\n" -H "User-Agent:" $E
          echo "=== CORS headers"; curl -sS -D - -o /dev/null -H "Origin: https://arro2121.github.io" $E | grep -i -E "^HTTP|access-control|server|x-cache|via"
          echo "=== summary"; curl -sS -o /dev/null -w "%{http_code}\n" "https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/summary?event=401815000"
