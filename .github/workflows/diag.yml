# Temporary: checks ESPN addresses for new features and saves samples. Safe to delete.
name: ESPN probe
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml", ".github/diag/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd .github/diag && python3 probe.py
      - if: always()
        run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag/samples && git commit -q -m "ESPN probe samples" && git push
