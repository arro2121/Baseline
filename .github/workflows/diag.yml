name: Alerts check
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml", ".github/diag/*.mjs"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Probe
        run: node .github/diag/probe_players.mjs 2>&1 | tee .github/diag/probe.log || true
      - name: Save
        run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add -A .github/diag && git commit -q -m "Probe results" && git pull -q --rebase && git push || echo nothing
