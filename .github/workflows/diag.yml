name: Alerts check
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the deploy
        run: sleep 150
      - name: Probe the alerts service
        run: |
          W=$(python3 -c "import json,urllib.request;print(json.load(urllib.request.urlopen('https://raw.githubusercontent.com/${{ github.repository }}/main/site_config.json'))['alerts_url'])")
          echo "worker: $W"
          for p in / /vapid "/sports/mlb/scoreboard" "/sports/nfl/scoreboard" "/sports/nba/scoreboard" "/sports/nhl/scoreboard" "/sports/epl/scoreboard"; do
            echo "== $p"; curl -s -m 20 -w "\nHTTP %{http_code}\n" "$W$p" | head -c 400; echo
          done
          echo "== subscribe validation"; curl -s -m 20 -X POST -H 'Content-Type: application/json' -d '{"sub":{}}' "$W/subscribe"; echo
