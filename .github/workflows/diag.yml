# Temporary: live check of every feature and the store screenshots. Safe to delete.
name: App check
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml", ".github/diag/shots.mjs"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install -q -r requirements.txt && python sports_engine.py --download --espn && python build_site.py && grep -o 'og:image" content="[^"]*' docs/index.html
      - run: (cd docs && python -m http.server 8000 >/dev/null 2>&1 &) && sleep 1
      - run: cd .github/diag && mkdir -p shots && npm init -y >/dev/null && npm i -s playwright@1.56.1 && node shots.mjs
      - if: always()
        run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag/shots && git commit -q -m "App check screenshots" && git push
