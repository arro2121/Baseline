# Temporary: screenshots of the published site. Safe to delete.
name: Site screenshots
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml", ".github/diag/shots.mjs"]
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd .github/diag && mkdir -p shots && npm init -y >/dev/null && npm i -s playwright@1.56.1 && node shots.mjs
      - run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag/shots && git commit -q -m "Site screenshots" && git push
