# Temporary: checks that the nightly job finds a logo for every team. Safe to delete.
name: Logo check
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml", "sports_engine.py"]
jobs:
  logos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q -r requirements.txt && python sports_engine.py --download --espn
      - run: |
          python - <<'PY'
          import json
          d = json.load(open("sports.json"))
          for lg, L in d["leagues"].items():
              miss = [t["name"] for t in L["teams"] if not t.get("logo")]
              print(lg, f"{len(L['teams']) - len(miss)}/{len(L['teams'])} logos", "missing:", miss, "sample:", L["teams"][0].get("logo"))
          PY
