# Temporary: samples of today's scoreboards with betting odds, for the model tracker. Safe to delete.
name: Odds samples
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .github/diag/odds2; cd .github/diag/odds2
          for p in soccer/eng.1 baseball/mlb football/nfl; do n=${p##*/}
            for d in 20260925 20260926 20260927; do
              curl -sS -m 30 -A "Mozilla/5.0" "https://site.web.api.espn.com/apis/site/v2/sports/$p/scoreboard?dates=$d" -o "web_${n}_$d.json" -w "web $n $d %{http_code} %{size_download}\n" || true
            done
          done
          curl -sS -m 30 -A "Mozilla/5.0" "https://cdn.espn.com/core/soccer/scoreboard?xhr=1&league=eng.1&dates=20260926" -o cdn_epl.json -w "cdn epl %{http_code} %{size_download}\n" || true
          curl -sS -m 30 -A "Mozilla/5.0" "https://cdn.espn.com/core/mlb/scoreboard?xhr=1&dates=20260925" -o cdn_mlb.json -w "cdn mlb %{http_code} %{size_download}\n" || true
          python3 - <<'PY'
          import json,glob
          for f in sorted(glob.glob("*.json")):
              try: d=json.load(open(f))
              except Exception as e: print(f, "bad"); continue
              d=d.get("content",{}).get("sbData",d) if "content" in d else d
              ev=d.get("events",[]); print(f, len(ev), "events")
              for e in ev:
                  o=((e.get("competitions") or [{}])[0].get("odds") or [None])[0]
                  if o: json.dump(o, open("odds_"+f, "w"), indent=1); break
              for g in glob.glob("*.json"): pass
          PY
          find . -name '*.json' -size +300k -delete
      - run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag && git commit -q -m "Odds samples 2" && git push
