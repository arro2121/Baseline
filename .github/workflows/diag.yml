# Temporary: what the alerts service returns for a month of NBA games. Safe to delete.
name: Probes
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .github/diag; cd .github/diag
          W=https://baseline-alerts.baseline-arro2121-3091.workers.dev
          curl -sS -m 60 "$W/sports/nba/scoreboard?dates=20261101-20261130" -o nov.json -w "nov %{http_code} %{size_download}\n"
          curl -sS -m 60 "$W/sports/nba/scoreboard?dates=20261020-20261031" -o oct.json -w "oct %{http_code} %{size_download}\n"
          curl -sS -m 60 "$W/sports/nba/scoreboard?dates=20261105" -o day.json -w "day %{http_code} %{size_download}\n"
          python3 -c "
          import json
          for f in ['nov.json','oct.json','day.json']:
              d=json.load(open(f)); g=d.get('games',[]); print(f, len(g), d.get('error'), [ (x['date'], x.get('stype'), x['status']['state'], x['home']['name']) for x in g[:4]])
          " > out.txt 2>&1; rm -f nov.json oct.json; head -c 1500 day.json > day_head.txt; rm day.json
      - run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag && git commit -q -m "Probe results" && git push
