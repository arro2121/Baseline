# Temporary: build the rosters once to check every source works. Safe to delete.
name: Probes
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  rosters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: |
          mkdir -p .github/diag
          node alerts/rosters.mjs > .github/diag/rosters.log 2>&1 || true
          node -e "const d=require('./docs/rosters.json');for(const[lg,l] of Object.entries(d.leagues)){console.log(lg,l.length,JSON.stringify(l.slice(0,2)))}" >> .github/diag/rosters.log 2>&1 || true
          cp docs/rosters.json .github/diag/rosters.json || true
      - run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag && git commit -q -m "Roster probe" && git push
