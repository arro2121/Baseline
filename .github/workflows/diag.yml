name: Alerts check
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Snapshot
        run: |
          (cd alerts && npm install --no-audit --no-fund --silent)
          node alerts/snapshot.mjs | tee .github/diag/snapshot.log
          cp docs/scores.json .github/diag/scores.json || true
      - name: Save
        run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag/snapshot.log .github/diag/scores.json && git commit -q -m "Snapshot check results" && git pull -q --rebase && git push || echo nothing
