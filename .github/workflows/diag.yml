name: Free API samples
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download samples
        run: |
          set -x
          D=.github/diag/free; mkdir -p $D
          H='Origin: https://arro2121.github.io'
          get(){ curl -s -m 30 -H "$H" -D "$D/$1.headers" -o "$D/$1.json" "$2" || true; }
          get mlb_schedule "https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=2026-09-23&hydrate=linescore,team,broadcasts(all),probablePitcher"
          get mlb_teams "https://statsapi.mlb.com/api/v1/teams?sportId=1"
          PK=$(python3 -c "import json;d=json.load(open('$D/mlb_schedule.json'));g=[g for x in d['dates'] for g in x['games'] if 'Tigers' in g['teams']['home']['team']['name']];print(g[0]['gamePk'])")
          echo "gamePk $PK"
          get mlb_feed "https://statsapi.mlb.com/api/v1.1/game/$PK/feed/live"
          get mlb_wp "https://statsapi.mlb.com/api/v1/game/$PK/winProbability"
          get mlb_content "https://statsapi.mlb.com/api/v1/game/$PK/content"
          get mlb_standings "https://statsapi.mlb.com/api/v1/standings?leagueId=103,104&season=2026&standingsTypes=regularSeason&hydrate=team"
          get nhl_score "https://api-web.nhle.com/v1/score/2026-09-23"
          GID=$(python3 -c "import json;d=json.load(open('$D/nhl_score.json'));g=[g for g in d.get('games',[]) if g.get('gameState') in ('OFF','FINAL')];print(g[0]['id'] if g else '')")
          echo "nhl game $GID"
          get nhl_pbp "https://api-web.nhle.com/v1/gamecenter/$GID/play-by-play"
          get nhl_landing "https://api-web.nhle.com/v1/gamecenter/$GID/landing"
          get nhl_box "https://api-web.nhle.com/v1/gamecenter/$GID/boxscore"
          get nhl_score_now "https://api-web.nhle.com/v1/score/now"
          get nhl_standings "https://api-web.nhle.com/v1/standings/now"
          get nba_today "https://cdn.nba.com/static/json/liveData/scoreboard/todaysScoreboard_00.json"
          ls -la $D; grep -il "access-control-allow-origin" $D/*.headers || echo "no CORS headers found"
          for f in $D/*.headers; do echo "== $f"; grep -i "^HTTP\|access-control\|content-type" $f; done
          # keep the repo light: trim huge files
          find $D -name '*.json' -size +3M -exec ls -la {} \;
      - name: Save
        run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag && git commit -q -m "Free API samples" && git push || echo nothing
