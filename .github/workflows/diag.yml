# Temporary: is the site reachable, and does cosmosports.app have its certificate yet? Safe to delete.
name: Probes
on:
  push:
    branches: [claude/dreamy-davinci-hedx5u]
    paths: [".github/workflows/diag.yml"]
permissions:
  contents: write
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p .github/diag; o=.github/diag/web.txt
          for u in https://arro2121.github.io/Baseline/ http://cosmosports.app/ https://cosmosports.app/ https://www.cosmosports.app/; do
            echo "== $u" >> $o; curl -sS -m 25 -o /dev/null -w "code %{http_code} -> %{redirect_url}\n" "$u" >> $o 2>&1 || true; done
          echo "== cert" >> $o; echo | openssl s_client -connect cosmosports.app:443 -servername cosmosports.app 2>/dev/null | openssl x509 -noout -subject -issuer -dates >> $o 2>&1 || echo "no certificate" >> $o
      - run: |
          git config user.name "baseline-bot"; git config user.email "baseline-bot@users.noreply.github.com"
          git add .github/diag && git commit -q -m "Web probe" && git push
