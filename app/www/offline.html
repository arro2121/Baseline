<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cosmo Sports</title>
<style>
html,body{margin:0;min-height:100%;background:radial-gradient(120% 80% at 50% 0%,#2a1766 0%,#0B0826 55%,#05030F 100%);color:#EEEBFF;font:16px -apple-system,system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
h1{font-size:1.5rem;margin:14px 0 6px}p{color:#A9A3D6;max-width:300px;margin:0 auto 20px;line-height:1.45}
.orb{width:84px;height:84px;border-radius:50%;margin:0 auto;background:radial-gradient(circle at 36% 30%,#8FF3FF,#4C8DFF 22%,#7A3DF5 52%,#C2338F 80%,#3A0F4F);box-shadow:0 10px 40px #7c3aed66}
button{font:inherit;font-weight:700;color:#fff;border:0;border-radius:12px;padding:12px 26px;background:linear-gradient(90deg,#7c3aed,#c026d3)}
</style></head>
<body><main><div><div class="orb" aria-hidden="true"></div><h1>You're offline</h1><p>Cosmo Sports needs a connection to load scores and your account. Check your connection and try again.</p>
<button onclick="location.replace('https://cosmosports.app/')">Try again</button></div></main></body></html>
