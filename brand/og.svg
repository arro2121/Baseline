<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<defs><radialGradient id="og" cx="30%" cy="40%" r="90%"><stop offset="0" stop-color="#2A1B6B"/><stop offset=".6" stop-color="#140F3A"/><stop offset="1" stop-color="#07061A"/></radialGradient></defs>
<rect width="1200" height="630" fill="url(#og)"/>
<g fill="#fff" opacity=".6"><circle cx="700" cy="90" r="3"/><circle cx="1100" cy="140" r="2.5"/><circle cx="1040" cy="520" r="3"/><circle cx="640" cy="560" r="2"/><circle cx="80" cy="80" r="2.5"/></g>
<svg x="40" y="75" width="480" height="480" viewBox="0 0 512 512">
  <!-- Cosmo Sports: one cosmic ball carrying the seams of basketball, baseball and soccer, circled by an orbit -->
  <defs>
    <radialGradient id="cmBall" cx="36%" cy="30%" r="78%">
      <stop offset="0" stop-color="#8FF3FF"/><stop offset=".22" stop-color="#4C8DFF"/><stop offset=".52" stop-color="#7A3DF5"/><stop offset=".8" stop-color="#C2338F"/><stop offset="1" stop-color="#3A0F4F"/>
    </radialGradient>
    <radialGradient id="cmNeb" cx="62%" cy="66%" r="46%"><stop offset="0" stop-color="#FF7AC8" stop-opacity=".75"/><stop offset="1" stop-color="#FF7AC8" stop-opacity="0"/></radialGradient>
    <radialGradient id="cmShade" cx="30%" cy="26%" r="80%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#05021A" stop-opacity=".55"/></radialGradient>
    <linearGradient id="cmRing" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFE9A3"/><stop offset=".5" stop-color="#FFC24A"/><stop offset="1" stop-color="#FF8A3D"/></linearGradient>
    <clipPath id="cmClip"><circle cx="256" cy="256" r="170"/></clipPath>
  </defs>
  <!-- the back half of the orbit -->
  <ellipse cx="256" cy="256" rx="236" ry="74" transform="rotate(-24 256 256)" fill="none" stroke="url(#cmRing)" stroke-width="16" opacity=".55"/>
  <circle cx="256" cy="256" r="170" fill="url(#cmBall)"/>
  <circle cx="256" cy="256" r="170" fill="url(#cmNeb)"/>
  <g clip-path="url(#cmClip)" fill="none" stroke="#fff" stroke-linecap="round">
    <!-- basketball seams -->
    <path d="M256 86 C 206 150 206 362 256 426" stroke-width="11" opacity=".92"/>
    <path d="M86 262 C 170 236 342 236 426 262" stroke-width="11" opacity=".92"/>
    <!-- baseball stitching -->
    <path d="M136 146 C 190 196 196 300 142 372" stroke-width="7" opacity=".85"/>
    <path d="M150 170 l16 -9 M163 196 l18 -5 M170 224 l18 -2 M172 252 l18 1 M170 280 l18 4 M164 308 l17 7 M154 336 l15 9" stroke="#FF6F9F" stroke-width="6"/>
    <!-- a soccer panel -->
    <path d="M338 318 l30 -10 l24 22 l-10 32 l-34 2 l-18 -26 z" fill="#140A33" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <circle cx="256" cy="256" r="170" fill="url(#cmShade)"/>
  <ellipse cx="196" cy="176" rx="54" ry="30" transform="rotate(-32 196 176)" fill="#fff" opacity=".22"/>
  <!-- the front half of the orbit, passing in front of the ball -->
  <path d="M40.4 352 A236 74 -24 0 0 471.6 160" fill="none" stroke="url(#cmRing)" stroke-width="16" stroke-linecap="round"/>
  <!-- stars -->
  <g fill="#FFF6D8">
    <path d="M430 92 l7 17 17 7 -17 7 -7 17 -7 -17 -17 -7 17 -7z"/>
    <path d="M78 104 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z" opacity=".9"/>
    <circle cx="452" cy="404" r="6" opacity=".8"/><circle cx="64" cy="420" r="5" opacity=".7"/>
  </g>
</svg>
<text x="556" y="282" font-family="Archivo, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="800" font-size="80" fill="#fff" letter-spacing="-1">Cosmo Sports</text>
<text x="564" y="352" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="34" fill="#C9C3FF">Live scores, replays, box scores and</text>
<text x="564" y="398" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="500" font-size="34" fill="#C9C3FF">predictions for every game.</text>
<text x="564" y="470" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" font-size="26" fill="#FFC24A">NFL · NBA · MLB · NHL · Premier League · Tennis</text>
</svg>